# Raw tables from the FPL API, stored in the local SQLite database (db_credentials).
#
# Season-specific tables use SeasonSQLTableDataset: a refresh replaces only the
# current season's rows, so earlier seasons are kept. Player and team IDs are
# reassigned each season, so always join these tables on (id, season).
#
# To use S3 instead, run with `--env cloud` (see conf/cloud/).

players:
  type: fpl_modelling.datasets.SeasonSQLTableDataset
  credentials: db_credentials
  table_name: players
  load_args:
    index_col: player_id

teams:
  type: fpl_modelling.datasets.SeasonSQLTableDataset
  credentials: db_credentials
  table_name: teams
  load_args:
    index_col: team_id

players_hist:
  type: fpl_modelling.datasets.SeasonSQLTableDataset
  credentials: db_credentials
  table_name: players_hist
  load_args:
    index_col: player_id

fixtures:
  type: fpl_modelling.datasets.SeasonSQLTableDataset
  credentials: db_credentials
  table_name: fixtures

# Positions are the same every season, so a plain replace is fine.
positions:
  type: pandas.SQLTableDataset
  credentials: db_credentials
  table_name: positions
  load_args:
    index_col: position_id
  save_args:
    index: false
    if_exists: replace

# Snapshot of your current squad, overwritten on each run.
my_current_team:
  type: pandas.SQLTableDataset
  credentials: db_credentials
  table_name: my_current_team
  load_args:
    index_col: player_id
  save_args:
    index: false
    if_exists: replace
